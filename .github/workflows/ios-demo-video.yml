name: iOS demo video

# Manual only: Actions -> "iOS demo video" -> Run workflow. Produces ios-demo.mp4 as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: Backend the app talks to
        default: https://lauzhauk-winners-2026-production.up.railway.app
        required: true
      device:
        description: Simulator name (first available iPhone if not found)
        default: iPhone 16 Pro
        required: true

jobs:
  video:
    name: Build, record and publish
    runs-on: macos-15
    timeout-minutes: 75
    env:
      API_BASE: ${{ inputs.api_base }}
      DEVICE_NAME: ${{ inputs.device }}
      DERIVED: ${{ github.workspace }}/build/derived
      VIDEO: ${{ github.workspace }}/build/ios-demo.mp4
      RESULT: ${{ github.workspace }}/build/DemoScenario.xcresult
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('frontend/kmp/**/*.gradle.kts') }}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd frontend/kmp/iosApp
          xcodegen generate

      - name: Boot the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          want = os.environ["DEVICE_NAME"]
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          exact = [d for d in devices if d["name"] == want]
          iphones = [d for d in devices if d["name"].startswith("iPhone")]
          pick = (exact or iphones)[0]
          print(pick["udid"])
          print("simulator:", pick["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light

      - name: Build the app and the UI tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project frontend/kmp/iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild-build.log | tail -n 40

      - name: Record the scripted demo
        run: |
          set -o pipefail
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$VIDEO" &
          REC=$!
          sleep 3
          status=0
          TEST_RUNNER_ALT_API_BASE="$API_BASE" xcodebuild test-without-building \
            -project frontend/kmp/iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            -only-testing:iosAppUITests/DemoScenarioUITests/testDemoLausanneToGeneva \
            -resultBundlePath "$RESULT" | tee build/xcodebuild-test.log | tail -n 40 || status=$?
          kill -INT "$REC"
          while kill -0 "$REC" 2>/dev/null; do sleep 1; done
          ls -lh "$VIDEO"
          exit $status

      - name: Publish the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-demo-video
          path: build/ios-demo.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots, test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-demo-results
          path: |
            build/DemoScenario.xcresult
            build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
