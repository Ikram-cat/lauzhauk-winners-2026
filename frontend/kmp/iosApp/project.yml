# Xcode project for the iOS host of the Compose Multiplatform app. Generated on macOS with:
#   cd frontend/kmp/iosApp && xcodegen generate
# The generated iosApp.xcodeproj is not committed (see .gitignore).
name: iosApp
options:
  bundleIdPrefix: ch.lauzhack.alt
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # Explicit Info.plist (generated by xcodegen): Compose Multiplatform iOS crashes at launch without
    # CADisableMinimumFrameDurationOnPhone = true (strict plist check in ComposeUIViewController).
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: ALT
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.lauzhack.alt.iosApp
        PRODUCT_NAME: ALT
        GENERATE_INFOPLIST_FILE: "NO"
        # The shared Kotlin code, built by the Gradle phase below (static framework "ComposeApp").
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        # The Gradle script writes outside the sandbox (Xcode 15+ default).
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :composeApp:embedAndSignAppleFrameworkForXcode
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.lauzhack.alt.iosAppUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests
