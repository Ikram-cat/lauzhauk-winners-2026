<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ALT — disruption-aware Swiss public transport journey planner (Compose Multiplatform / Wasm).">
  <title>ALT — Swiss journey planner</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
    body { font-family: Helvetica, Arial, sans-serif; }
    canvas { outline: none; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 700 13px Helvetica, Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6b6b; }
    #boot.hidden { display: none; }
  </style>
</head>
<body>
  <div id="boot">Loading ALT…</div>
  <script>
    // Same-origin by default: serve this folder with `node frontend/kmp/serve.mjs`,
    // which proxies /api and /health to the deployed Ktor backend.
    globalThis.ALT_API_BASE = globalThis.ALT_API_BASE || "";
    window.addEventListener("load", function () {
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) b.classList.add("hidden");
      }, 1200);
    });
  </script>
  <script src="composeApp.js"></script>
</body>
</html>
